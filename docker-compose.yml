services:
  mysql:
    image: mysql:8.0
    container_name: document-approval-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: document_approval_workflow
      MYSQL_USER: daw_user
      MYSQL_PASSWORD: daw_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: document-approval-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/document_approval_workflow
      SPRING_DATASOURCE_USERNAME: daw_user
      SPRING_DATASOURCE_PASSWORD: daw_password
      JWT_SECRET: change-this-development-secret
    ports:
      - "8080:8080"

volumes:
  mysql_data:
